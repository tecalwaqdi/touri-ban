  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="لوحة التحكم — توري">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1F7372">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#185E5D">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta property="og:title" content="لوحة التحكم — توري تاكسي">

  <title>لوحة التحكم — توري تاكسي</title>
  <meta name="description" content="لوحة تحكم ويب لإدارة الحجوزات، المناديب، المالية، والعمليات.">

  <link rel="manifest" href="manifest.json">
  <style>
    /* Instant shell while Flutter boots */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4F7F8;
      font-family: Cairo, Tajawal, system-ui, sans-serif;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #1F7372;
      z-index: 9999;
      background: #F4F7F8;
      transition: opacity 0.25s ease;
    }
    #loading-splash.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(31,115,114,0.2);
      border-top-color: #1F7372;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #154D42;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #154D42;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <div id="loading-splash" aria-live="polite">
    <div class="spinner"></div>
    <div>جاري تحميل لوحة التحكم…</div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDerhonj6V-7hdTOUdCEk1hwCtr-3Hce-4"></script>
  <script>
    {{flutter_bootstrap_js}}
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 300);
      }
    });
  </script>


</body></html>
