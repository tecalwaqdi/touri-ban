<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Touri Taxi payment</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || "");
        var outcome = (params.get("outcome") || params.get("status") || "").toLowerCase();
        var sessionId = params.get("sessionId") || params.get("session_id") || "";
        var failed = outcome === "cancel" || outcome === "cancelled" ||
          outcome === "canceled" || outcome === "failed" || outcome === "fail";
        var q = new URLSearchParams({
          fromWebView: failed ? "true" : "false",
          awaitingExternalHpp: "false"
        });
        if (sessionId) q.set("sessionId", sessionId);
        if (failed) q.set("outcome", outcome === "failed" || outcome === "fail" ? "failed" : "cancel");
        var target = "araoatanapp://araoatanapp.com/paymentConfirm?" + q.toString();
        try { window.location.replace(target); } catch (e) {}
        setTimeout(function () {
          try { window.location.href = target; } catch (e2) {}
        }, 400);
        window.__TOURI_PAYMENT_DEEPLINK__ = target;
      })();
    </script>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #123b3a;
        background: #f7fbfa;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
        text-align: center;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: #008f86;
        font-size: 1.75rem;
      }
      h1 { font-size: 1.35rem; }
      p { line-height: 1.6; color: #4b6664; }
      a.btn {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #008f86;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        :root { color: #e8f7f5; background: #101918; }
        p { color: #b7cfcc; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">&#10003;</div>
      <h1>Return to Touri Taxi</h1>
      <p>The application is securely verifying the payment status with N-Genius.</p>
      <p dir="rtl">ارجع إلى تطبيق توري تاكسي، وسيتم التحقق من حالة الدفع بأمان.</p>
      <a class="btn" id="open-app" href="araoatanapp://araoatanapp.com/paymentConfirm?fromWebView=false&amp;awaitingExternalHpp=false">Open Touri Taxi</a>
    </main>
    <script>
      (function () {
        var a = document.getElementById("open-app");
        if (a && window.__TOURI_PAYMENT_DEEPLINK__) a.href = window.__TOURI_PAYMENT_DEEPLINK__;
      })();
    </script>
  </body>
</html>
